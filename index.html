<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <aside class="info-guide">
      <img
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix for prioritizing tasks"
      /><a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </aside>
    <main class="centered-main-page-element">
      <h1 class="visually-hidden">Todo App</h1>
      <div id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" /><button>Add</button>
        </div>
      </div>
      <section>
        <h2>Todo</h2>
        <ul id="incompleteTasks">
          <li>
            <input type="checkbox" id="task-pay-bills" /><label
              for="task-pay-bills"
              class="task"
              >Pay Bills</label
            ><input
              type="text"
              id="edit-pay-bills"
              aria-label="Edit Pay Bills"
              class="task"
            /><button class="edit">Edit</button
            ><button class="delete" aria-label="Delete Pay Bills">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
          <li class="editMode">
            <input type="checkbox" id="task-shopping" /><label
              for="task-shopping"
              class="task"
              >Go Shopping</label
            ><input
              type="text"
              id="edit-task-shopping"
              aria-label="Edit Go Shopping"
              value="Go Shopping"
              class="task"
            /><button class="edit">Save</button
            ><button class="delete" aria-label="Delete Go Shopping">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" id="task-doctor" checked /><label
              for="task-doctor"
              class="task"
              >See the Doctor</label
            ><input
              type="text"
              id="edit-see-doctor"
              aria-label="Edit See the Doctor"
              class="task"
            /><button class="edit">Edit</button
            ><button class="delete" aria-label="Delete See the Doctor">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
